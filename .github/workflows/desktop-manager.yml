name: desktop-manager

on:
  push:
    paths:
      - 'desktop-manager/**'
      - '.github/workflows/desktop-manager.yml'
  pull_request:
    paths:
      - 'desktop-manager/**'
      - '.github/workflows/desktop-manager.yml'
  workflow_dispatch:
    inputs:
      dump_screenshots:
        description: 'Screenshots to print into the log as base64 JPEG, e.g. tab0,tab1'
        type: string
        default: ''

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet run -c Release --project desktop-manager/tests
      - name: Build the Windows exe on Linux
        run: dotnet build -c Release desktop-manager/src

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet run -c Release --project desktop-manager/tests
      - name: Build
        run: |
          dotnet build -c Release desktop-manager/src
          dotnet build -c Release desktop-manager/tests/FakeClaude
      - name: Self test against the real Windows APIs
        timeout-minutes: 3
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process desktop-manager/src/bin/Release/net48/ClaudeDesktopManager.exe -ArgumentList 'selftest', '--out', $out -Wait -PassThru
          Get-Content $out -Encoding UTF8
          exit $p.ExitCode
      - name: End-to-end test with a fake Claude.exe
        timeout-minutes: 8
        shell: pwsh
        run: >
          ./desktop-manager/tests/e2e.ps1
          -Manager (Resolve-Path desktop-manager/src/bin/Release/net48/ClaudeDesktopManager.exe)
          -Fake (Resolve-Path desktop-manager/tests/FakeClaude/bin/Release/net48/FakeClaude.exe)
      - name: Screenshots of every tab (demo data)
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'screenshots'
          $p = Start-Process desktop-manager/src/bin/Release/net48/ClaudeDesktopManager.exe -ArgumentList '--demo', '--screenshot', $dir -Wait -PassThru
          Get-ChildItem $dir
      - name: Print screenshots into the log
        if: ${{ always() && inputs.dump_screenshots != '' }}
        shell: powershell
        env:
          SHOTS: ${{ inputs.dump_screenshots }}
        run: |
          # Artifacts are not reachable from every place that reads these results; the log is.
          Add-Type -AssemblyName System.Drawing
          $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $q = New-Object System.Drawing.Imaging.EncoderParameters 1
          $q.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality, [long]60)
          foreach ($name in $env:SHOTS.Split(',')) {
            $path = Join-Path (Join-Path $env:RUNNER_TEMP 'screenshots') ($name.Trim() + '.png')
            if (-not (Test-Path $path)) { continue }
            $img = [System.Drawing.Image]::FromFile($path)
            $small = New-Object System.Drawing.Bitmap ([int]($img.Width * 0.8)), ([int]($img.Height * 0.8))
            $g = [System.Drawing.Graphics]::FromImage($small)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($img, 0, 0, $small.Width, $small.Height)
            $g.Dispose()
            $img.Dispose()
            $ms = New-Object System.IO.MemoryStream
            $small.Save($ms, $jpeg, $q)
            $small.Dispose()
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            for ($i = 0; $i -lt $b64.Length; $i += 3000) { 'IMG ' + $name.Trim() + ' ' + $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeDesktopManager
          path: desktop-manager/src/bin/Release/net48/ClaudeDesktopManager.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
